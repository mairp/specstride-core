# Mergify merges a PR into main once CI is green.
# Opt out on a PR by labelling it `do-not-merge` or keeping it a draft.
# Head branches are deleted by GitHub's "automatically delete head branches"
# repo setting; main's branch protection requires lint + test.
pull_request_rules:
  - name: merge when CI passes
    conditions:
      - base = main
      - -draft
      - -conflict
      - label != do-not-merge
      - check-success = lint
      - check-success = test
      # No AI-assistant session or conversation may be exposed (.github/workflows/no-session-links.yml):
      # the status covers files, commit messages and the whole PR conversation; title and body are
      # also refused here directly.
      - check-success = no-session-links
      - -title ~= (?i)claude[.]ai
      - -body ~= (?i)claude[.]ai
    actions:
      merge:
        method: merge
