name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck:src
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:imports

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Debug the failing tests on the runner
        if: failure()
        run: |
          echo "HOME=$HOME"
          echo "XDG_CONFIG_HOME=${XDG_CONFIG_HOME:-<unset>}"
          echo "XDG_STATE_HOME=${XDG_STATE_HOME:-<unset>}"
          echo "XDG_CACHE_HOME=${XDG_CACHE_HOME:-<unset>}"
          env | grep -E "^(XDG|SPECSTRIDE|NODE_OPTIONS)" | sort || true
          node -e "console.log('homedir():', require('node:os').homedir())"
          node --test packages/cli/test/contract-derive-task-groups.test.ts 2>&1 | tail -30 || true
          node --test packages/cli/test/engine/loop-speed-handoff.test.ts 2>&1 | grep -E "^not ok|^# pass|^# fail" || true
      - run: npm run test:e2e
      - run: npm run pack:release
